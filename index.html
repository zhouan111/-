<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>澳門字民｜澳門街頭招牌文字檔案索引</title>
    <meta name="description" content="澳門街頭招牌文字檔案索引 - 3D立體書架檔案庫與文獻索引系統" />
    <meta property="og:title" content="澳門字民｜澳門街頭招牌文字檔案索引" />
    <meta property="og:description" content="澳門街頭招牌文字檔案索引 - 3D立體書架檔案庫與文獻索引系統" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #070708;
        --text: #f5f4ef;
        --text-dim: #8a8880;
        --border-archival: rgba(255, 255, 255, 0.12);
        --accent-gold: #c8ab7e;
        --fs-title: min(32vw, 42vh);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
      }
      /* WebGL 3D Canvas */
      #webgl-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        outline: none;
        cursor: grab;
      }
      #webgl-canvas:active {
        cursor: grabbing;
      }

      /* Archival Paper Noise */
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0.035;
        background-image: radial-gradient(#fff 1px, transparent 1px);
        background-size: 3px 3px;
      }

      /* Navigation (z: 10) */
      header.top-nav {
        position: fixed;
        top: 3.8vh;
        left: 5vw;
        right: 5vw;
        height: 48px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: auto;
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        color: var(--text);
      }
      .brand-emblem {
        width: 32px;
        height: 38px;
        background: #b8a58a;
        border-radius: 2px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      }
      .brand-emblem::after {
        content: '';
        width: 8px;
        height: 66%;
        background: #16120d;
        border-radius: 1px;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
      }
      .brand-name {
        font-family: 'Noto Serif TC', serif;
        font-weight: 600;
        font-size: clamp(16px, 1.4vw, 22px);
        letter-spacing: 0.08em;
        line-height: 1.1;
      }
      .brand-sub {
        font-size: clamp(9px, 0.65vw, 11px);
        letter-spacing: 0.14em;
        color: var(--text-dim);
        font-weight: 400;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 2.2vw;
        font-size: clamp(11px, 0.78vw, 14px);
        letter-spacing: 0.06em;
      }
      .nav-link {
        color: rgba(255, 255, 255, 0.78);
        text-decoration: none;
        transition: color 0.2s ease;
        cursor: pointer;
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
      }
      .nav-link:hover {
        color: #ffffff;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .index-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: clamp(11px, 0.75vw, 13px);
        letter-spacing: 0.08em;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s ease;
        backdrop-filter: blur(8px);
      }
      .index-btn:hover {
        background: #fff;
        color: #000;
        transform: translateY(-1px);
        border-color: #fff;
      }
      .badge-count {
        background: var(--accent-gold);
        color: #12100e;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 10px;
      }

      /* Hero Wordmark (z: 1) */
      .hero-wordmark {
        position: fixed;
        width: 100%;
        text-align: center;
        top: calc(46vh - (var(--fs-title) * 0.76));
        left: 0;
        z-index: 1;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hero-title {
        font-family: 'Noto Serif TC', serif;
        font-size: var(--fs-title);
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 0.92;
        color: rgba(245, 244, 239, 0.94);
        text-shadow: 0 10px 40px rgba(0,0,0,0.8);
      }
      .hero-subtitle {
        margin-top: 1.5vh;
        font-size: clamp(11px, 0.82vw, 15px);
        letter-spacing: 0.35em;
        color: rgba(255, 255, 255, 0.45);
        font-weight: 300;
        text-transform: uppercase;
      }

      /* Category Sub-Row (z: 1) */
      .category-row {
        position: fixed;
        top: 52vh;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: clamp(12px, 1.8vw, 28px);
        z-index: 1;
        pointer-events: auto;
      }
      .cat-tag {
        font-size: clamp(10px, 0.72vw, 12px);
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.12em;
        cursor: pointer;
        transition: color 0.2s ease;
        background: none;
        border: none;
        font-family: inherit;
      }
      .cat-tag:hover {
        color: var(--accent-gold);
      }

      /* Bottom Tip & Counter */
      .bottom-info {
        position: fixed;
        bottom: 24px;
        left: 5vw;
        right: 5vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 4;
        pointer-events: none;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.35);
      }
      .interact-hint {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hint-dot {
        width: 6px;
        height: 6px;
        background: var(--accent-gold);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent-gold);
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      /* Collapsible Drawer (TOC / 文字目錄索引) */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .drawer-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
      .index-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: min(450px, 90vw);
        height: 100%;
        background: #0d0f12;
        border-left: 1px solid var(--border-archival);
        z-index: 45;
        transform: translateX(100%);
        transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
        box-shadow: -15px 0 45px rgba(0,0,0,0.8);
      }
      .index-drawer.open {
        transform: translateX(0);
      }
      .drawer-header {
        padding: 24px 28px;
        border-bottom: 1px solid var(--border-archival);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer-title-group h2 {
        font-family: 'Noto Serif TC', serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .drawer-title-group p {
        font-size: 11px;
        color: var(--text-dim);
        letter-spacing: 0.12em;
        margin-top: 4px;
      }
      .close-drawer-btn {
        background: transparent;
        border: 1px solid var(--border-archival);
        color: var(--text);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .close-drawer-btn:hover {
        background: #fff;
        color: #000;
      }
      .drawer-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .drawer-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.2s ease;
        background: rgba(255,255,255,0.02);
      }
      .drawer-item:hover {
        background: rgba(255,255,255,0.06);
        border-color: rgba(255,255,255,0.12);
        transform: translateX(-4px);
      }
      .item-id {
        font-family: monospace;
        font-size: 13px;
        color: var(--accent-gold);
        letter-spacing: 0.05em;
        width: 34px;
      }
      .item-details {
        flex: 1;
        overflow: hidden;
      }
      .item-name {
        font-size: 14px;
        font-weight: 500;
        color: #f1efe8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-loc {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-arrow {
        color: rgba(255, 255, 255, 0.2);
        font-size: 14px;
        transition: transform 0.2s ease;
      }
      .drawer-item:hover .item-arrow {
        color: #fff;
        transform: translateX(3px);
      }

      /* Archival Document Modal (深色文獻風格彈窗) */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(14px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
      .archive-card {
        width: 100%;
        max-width: 900px;
        max-height: 92vh;
        background: #0e1013;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        overflow: hidden;
        transform: translateY(18px) scale(0.98);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }
      .modal-backdrop.active .archive-card {
        transform: translateY(0) scale(1);
      }
      .card-header-bar {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-archival);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.02);
      }
      .specimen-id {
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        color: var(--accent-gold);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .specimen-id::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--accent-gold);
      }
      .close-card-btn {
        background: transparent;
        border: 1px solid var(--border-archival);
        color: rgba(255, 255, 255, 0.7);
        padding: 5px 12px;
        font-size: 11px;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.2s;
        font-family: inherit;
      }
      .close-card-btn:hover {
        background: #fff;
        color: #000;
        border-color: #fff;
      }

      .card-body {
        flex: 1;
        overflow-y: auto;
        padding: 28px;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 28px;
      }
      @media (max-width: 768px) {
        .card-body {
          grid-template-columns: 1fr;
        }
      }

      /* Image viewer */
      .image-viewer {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .image-display-frame {
        width: 100%;
        min-height: 310px;
        max-height: 50vh;
        background: #08090a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .image-display-frame img {
        width: 100%;
        height: 100%;
        max-height: 50vh;
        object-fit: contain;
        display: block;
        transition: transform 0.3s ease;
      }
      .image-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: rgba(255, 255, 255, 0.35);
        font-size: 13px;
        letter-spacing: 0.16em;
        padding: 40px;
        text-align: center;
      }
      .fallback-stamp {
        border: 1px dashed rgba(200, 171, 126, 0.4);
        color: var(--accent-gold);
        padding: 8px 18px;
        font-size: 12px;
        letter-spacing: 0.2em;
        border-radius: 2px;
      }
      .tab-buttons {
        display: flex;
        gap: 8px;
      }
      .tab-btn {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.6);
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 0.08em;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .tab-btn.active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }

      /* Archival Details */
      .card-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .signboard-title {
        font-family: 'Noto Serif TC', serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #ffffff;
        line-height: 1.25;
        border-bottom: 1px solid var(--border-archival);
        padding-bottom: 14px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .meta-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .meta-label {
        font-size: 10px;
        color: var(--text-dim);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .meta-value {
        font-size: 13px;
        color: #e5e4de;
        line-height: 1.5;
        font-weight: 400;
      }
      .note-box {
        background: rgba(255, 255, 255, 0.03);
        border-left: 2px solid var(--accent-gold);
        padding: 12px 16px;
        font-size: 12px;
        line-height: 1.7;
        color: #c9c7bf;
      }

      .card-footer-nav {
        padding: 14px 24px;
        border-top: 1px solid var(--border-archival);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.015);
      }
      .nav-step-btn {
        background: transparent;
        border: 1px solid var(--border-archival);
        color: rgba(255, 255, 255, 0.7);
        padding: 6px 14px;
        font-size: 11px;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.2s;
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-step-btn:hover {
        border-color: #fff;
        color: #fff;
      }
      .return-index-btn {
        background: #f5f4ef;
        border: none;
        color: #000;
        padding: 7px 18px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .return-index-btn:hover {
        background: #ffffff;
        box-shadow: 0 0 14px rgba(255,255,255,0.3);
      }

      /* Mobile styles */
      @media (max-width: 760px) {
        header.top-nav {
          left: 4vw;
          right: 4vw;
          top: 2.5vh;
        }
        .nav-links {
          display: none;
        }
        .hero-wordmark {
          top: 14vh;
        }
        :root {
          --fs-title: 34vw;
        }
        .category-row {
          top: 36vh;
          flex-wrap: wrap;
          padding: 0 6vw;
        }
      }
    </style>
  </head>
  <body>
    <!-- 3D Three.js WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Visual Grain -->
    <div class="grain"></div>

    <!-- Header Navigation -->
    <header class="top-nav">
      <a href="#" class="brand-box">
        <div class="brand-emblem"></div>
        <div class="brand-text">
          <span class="brand-name">澳門字民</span>
          <span class="brand-sub">MACAU TYPOGRAPHY ARCHIVE</span>
        </div>
      </a>

      <nav class="nav-links">
        <button class="nav-link" id="nav-filter-all">全部檔案 (20)</button>
        <button class="nav-link" id="nav-filter-beirwei">關前正街</button>
        <button class="nav-link" id="nav-filter-neon">草堆街</button>
        <button class="nav-link" id="nav-filter-handcraft">官也街</button>
      </nav>

      <div class="nav-actions">
        <button class="index-btn" id="open-drawer-btn">
          <span>文字目錄</span>
          <span class="badge-count">20</span>
        </button>
      </div>
    </header>

    <!-- Central Hero Wordmark -->
    <div class="hero-wordmark">
      <h1 class="hero-title">澳門字民</h1>
      <p class="hero-subtitle">澳門街頭招牌文字檔案索引 · SPECIMEN № 01–20</p>
    </div>

    <!-- Category Sub-Row -->
    <div class="category-row">
      <button class="cat-tag" data-loc="關前正街">關前正街</button>
      <button class="cat-tag" data-loc="草堆街">草堆街</button>
      <button class="cat-tag" data-loc="營地大街">營地大街</button>
      <button class="cat-tag" data-loc="爛鬼樓">爛鬼樓</button>
      <button class="cat-tag" data-loc="高士德">高士德</button>
      <button class="cat-tag" data-loc="官也街">官也街</button>
      <button class="cat-tag" data-loc="白馬行">白馬行</button>
    </div>

    <!-- Bottom Status Bar -->
    <div class="bottom-info">
      <div class="interact-hint">
        <div class="hint-dot"></div>
        <span>移動游標掠過書架產生波浪彈性浮動 · 點擊立體書檢視招牌檔案</span>
      </div>
      <div>ARE.NA FIELD CORPUS // 20 SIGNAGE RECORDS INDEXED</div>
    </div>

    <!-- Collapsible Index Drawer (文字目錄索引) -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="index-drawer" id="index-drawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h2>文字目錄索引</h2>
          <p>MACAU SIGNAGE ARCHIVE INDEX</p>
        </div>
        <button class="close-drawer-btn" id="close-drawer-btn" title="關閉目錄">✕</button>
      </div>
      <div class="drawer-list" id="drawer-list">
        <!-- Dynamically populated from archiveData -->
      </div>
    </aside>

    <!-- Archival Document Modal (深色文獻風格彈窗) -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="archive-card" id="archive-card">
        <div class="card-header-bar">
          <div class="specimen-id" id="modal-specimen-id">ARCHIVE № 01 // 澳門街頭招牌</div>
          <button class="close-card-btn" id="close-card-btn">關閉 [ESC]</button>
        </div>
        <div class="card-body">
          <div class="image-viewer">
            <div class="tab-buttons">
              <button class="tab-btn active" id="tab-btn-photo">實拍記錄</button>
              <button class="tab-btn" id="tab-btn-script">字稿摹寫</button>
            </div>
            <div class="image-display-frame" id="image-display-frame">
              <!-- Rendered via JS -->
            </div>
          </div>
          <div class="card-info">
            <h2 class="signboard-title" id="modal-title">招牌名稱</h2>
            <div class="meta-grid">
              <div class="meta-field">
                <span class="meta-label">拍攝地點 / LOCATION</span>
                <span class="meta-value" id="modal-location">—</span>
              </div>

      // Palette of rich archival bookcloth colors
      const spineColors = [
        '#2a4356', '#1b4a31', '#7b2520', '#3b3a36', '#2b658a',
        '#684f23', '#3e3852', '#524338', '#254d4f', '#1d1d1f',
        '#543224', '#1f3c64', '#3d4838', '#5b3240', '#744621',
        '#233f44', '#663920', '#1c2e42', '#3a444a', '#243c32'
      ];

      // Procedural textures
      function createPageEdgeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#eee7d8';
        ctx.fillRect(0, 0, 256, 256);
        for (let y = 0; y < 256; y += 2) {
          const alpha = 0.05 + Math.random() * 0.12;
          ctx.fillStyle = `rgba(130, 110, 85, ${alpha})`;
          ctx.fillRect(0, y, 256, 1);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        return texture;
      }

      function createSpineTexture(item, colorHex) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 768;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = colorHex;
        ctx.fillRect(0, 0, 128, 768);

        // Archival Foil Lines
        ctx.strokeStyle = 'rgba(215, 185, 140, 0.45)';
        ctx.lineWidth = 2;
        ctx.strokeRect(12, 16, 104, 736);
        ctx.strokeRect(16, 20, 96, 728);

        // ID Number
        ctx.fillStyle = '#eedcb2';
        ctx.font = 'bold 26px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`№ ${item.id}`, 64, 68);

        // Divider
        ctx.beginPath();
        ctx.moveTo(34, 88);
        ctx.lineTo(94, 88);
        ctx.stroke();

        // Signboard Title - Vertical Writing (filter out emojis for clean book spine typography)
        const cleanTitle = (item.title || `招牌 ${item.id}`).replace(/[\p{Emoji}\u200d]+/gu, '').trim() || item.title;
        ctx.font = 'bold 36px "Noto Serif TC", serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 4;

        const chars = cleanTitle.slice(0, 8).split('');
        const startY = 160;
        const step = 44;
        chars.forEach((char, idx) => {
          ctx.fillText(char, 64, startY + idx * step);
        });

        // Bottom imprint
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(238, 220, 178, 0.7)';
        ctx.font = '16px "Noto Sans TC", sans-serif';
        ctx.fillText('澳門字民', 64, 715);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createCoverTexture(item, colorHex, onReady) {
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 960;
        const ctx = canvas.getContext('2d');

        function renderFallbackArchivalCover() {
          // Archival cloth texture base
          ctx.fillStyle = '#111317';
          ctx.fillRect(0, 0, 640, 960);

          // Subtle fold shadow
          const grad = ctx.createLinearGradient(0, 0, 640, 0);
          grad.addColorStop(0, 'rgba(0,0,0,0.7)');
          grad.addColorStop(0.06, 'rgba(255,255,255,0.06)');
          grad.addColorStop(0.12, 'transparent');
          grad.addColorStop(0.95, 'transparent');
          grad.addColorStop(1, 'rgba(0,0,0,0.6)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 640, 960);

          // Outer frame
          ctx.strokeStyle = 'rgba(200, 171, 126, 0.55)';
          ctx.lineWidth = 3;
          ctx.strokeRect(36, 36, 568, 888);

          ctx.strokeStyle = 'rgba(200, 171, 126, 0.22)';
          ctx.lineWidth = 1;
          ctx.strokeRect(46, 46, 548, 868);

          // Header
          ctx.fillStyle = '#c8ab7e';
          ctx.font = '18px monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`FOLIO ARCHIVE // 澳門街頭招牌 № ${item.id}`, 320, 95);

          // Archival stamp box
          ctx.strokeStyle = 'rgba(200, 171, 126, 0.4)';
          ctx.strokeRect(100, 130, 440, 480);

          // Signboard Name in Center
          const title = item.title || `招牌文字 ${item.id}`;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 58px "Noto Serif TC", serif';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 12;

          if (title.length <= 4) {
            ctx.fillText(title, 320, 385);
          } else {
            const part1 = title.slice(0, Math.ceil(title.length / 2));
            const part2 = title.slice(Math.ceil(title.length / 2));
            ctx.fillText(part1, 320, 350);
            ctx.fillText(part2, 320, 430);
          }

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#c8ab7e';
          ctx.font = '22px "Noto Serif TC", serif';
          ctx.fillText(`【 ${item.style ? item.style.split('·')[0].trim() : '實地文字記錄'} 】`, 320, 520);

          // Details at bottom
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.font = '20px "Noto Sans TC", sans-serif';
          ctx.fillText(item.location || '澳門街道歷史片區', 320, 690);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.font = '15px monospace';
          ctx.fillText(`MACAU URBAN SIGNAGE CORPUS · SPECIMEN ${item.id}`, 320, 735);

          ctx.fillStyle = '#9b8d77';
          ctx.font = '18px "Noto Serif TC", serif';
          ctx.fillText('澳門字民 · 街頭字體田野採集計劃', 320, 850);
        }

        renderFallbackArchivalCover();

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;

        // Load image with seamless local -> remote fallback
        function tryLoadImage(srcUrl, fallbackUrl) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            // Draw sleek dark photo mount
            ctx.fillStyle = '#08090b';
            ctx.fillRect(0, 0, 640, 960);

            const targetX = 36;
            const targetY = 110;
            const targetW = 568;
            const targetH = 630;

            const scale = Math.min(targetW / img.width, targetH / img.height);
            const drawW = img.width * scale;
            const drawH = img.height * scale;
            const drawX = targetX + (targetW - drawW) / 2;
            const drawY = targetY + (targetH - drawH) / 2;

            // Background subtle blur/fill
            ctx.fillStyle = '#121418';
            ctx.fillRect(targetX, targetY, targetW, targetH);
            ctx.drawImage(img, drawX, drawY, drawW, drawH);

            // Double border frame
            ctx.strokeStyle = 'rgba(200, 171, 126, 0.55)';
            ctx.lineWidth = 2;
            ctx.strokeRect(36, 36, 568, 888);

            ctx.fillStyle = '#c8ab7e';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`№ ${item.id}`, 50, 78);

            ctx.textAlign = 'right';
            ctx.font = '15px "Noto Sans TC", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText((item.location || '澳門街道').split('區').pop().slice(0, 12), 590, 78);

            // Bottom title box
            ctx.fillStyle = 'rgba(10, 12, 16, 0.94)';
            ctx.fillRect(36, 765, 568, 159);
            ctx.strokeStyle = 'rgba(200, 171, 126, 0.3)';
            ctx.strokeRect(36, 765, 568, 159);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "Noto Serif TC", serif';
            ctx.textAlign = 'center';
            ctx.fillText(item.title || `招牌 ${item.id}`, 320, 825);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.font = '17px "Noto Sans TC", sans-serif';
            ctx.fillText(item.style || '澳門字民 · 實地採集檔案', 320, 875);

            texture.needsUpdate = true;
            if (onReady) onReady();
          };

          img.onerror = () => {
            if (fallbackUrl && img.src !== fallbackUrl) {
              tryLoadImage(fallbackUrl, null);
            } else {
              texture.needsUpdate = true;
              if (onReady) onReady();
            }
          };

          img.src = srcUrl;
        }

        tryLoadImage(item.photoUrl, item.remoteUrl);

        return texture;
      }

      // 2. Setup Three.js Scene
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();

      // Camera
      const isMobile = window.innerWidth <= 760;
      const camera = new THREE.PerspectiveCamera(
        isMobile ? 38 : 19.5,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(3.6, 2.15, 7.4);
      const cameraLookAt = new THREE.Vector3(-1.4, 0.05, -0.6);
      camera.lookAt(cameraLookAt);

      // Environment & Lights
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;

      const keyLight = new THREE.DirectionalLight(0xfff3e4, 2.4);
      keyLight.position.set(-4, 6, 6);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xbfd2ff, 1.1);
      rimLight.position.set(6, 3, -4);
      scene.add(rimLight);

      const ambLight = new THREE.AmbientLight(0xffffff, 0.12);
      scene.add(ambLight);

      // 3. Books Construction
      const bookCount = 20;
      const books = [];
      const sharedGeometry = new THREE.BoxGeometry(1.0, 1.5, 0.22);
      const pageTexture = createPageEdgeTexture();

      const pageMaterial = new THREE.MeshStandardMaterial({
        map: pageTexture,
        roughness: 0.9,
        metalness: 0.0
      });

      for (let i = 0; i < bookCount; i++) {
        const item = archiveData[i] || { id: String(i + 1).padStart(2, '0'), title: `招牌 ${i + 1}` };
        const color = spineColors[i % spineColors.length];

        const spineTexture = createSpineTexture(item, color);
        const spineMaterial = new THREE.MeshPhysicalMaterial({
          map: spineTexture,
          color: new THREE.Color(color).multiplyScalar(0.72),
          roughness: 0.55,
          clearcoat: 0.35,
          clearcoatRoughness: 0.3
        });

        const coverTexture = createCoverTexture(item, color);
        const coverMaterial = new THREE.MeshPhysicalMaterial({
          map: coverTexture,
          roughness: 0.42,
          clearcoat: 0.55,
          clearcoatRoughness: 0.35
        });

        const backMaterial = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(color).multiplyScalar(0.62),
          roughness: 0.6
        });

        const materials = [
          pageMaterial,  // +x: Fore-edge
          spineMaterial, // -x: Spine
          pageMaterial,  // +y: Top
          pageMaterial,  // -y: Bottom
          coverMaterial, // +z: Front Cover
          backMaterial   // -z: Back Cover
        ];

        const mesh = new THREE.Mesh(sharedGeometry, materials);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const group = new THREE.Group();
        const posX = 1.55 + i * (-0.46);
        const posY = -1.12;
        const posZ = 0.9 + i * (-0.21);
        group.position.set(posX, posY, posZ);
        group.rotation.y = 0.32;

        group.add(mesh);
        scene.add(group);

        books.push({
          id: item.id,
          index: i,
          item,
          group,
          mesh,
          y: -3.0,
          vy: 0.0,
          z: 0.0,
          vz: 0.0,
          targetY: -3.0,
          targetZ: 0.0
        });
      }

      // 4. Spring Wave Physics & Cursor Tracking
      let mouseX = -9999;
      let mouseY = -9999;
      let isPointerActive = false;
      let lastPointerTime = performance.now();
      let dragStartX = 0;
      let isDragging = false;
      let shelfPanOffset = 0;
      let shelfPanVelocity = 0;

      function updatePointerPos(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isPointerActive = true;
        lastPointerTime = performance.now();
      }

      window.addEventListener('pointermove', updatePointerPos);
      window.addEventListener('pointerleave', () => {
        isPointerActive = false;
      });

      // Pointer drag to gently nudge shelf horizontally
      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        dragStartX = e.clientX;
      });
      window.addEventListener('pointerup', () => {
        isDragging = false;
      });
      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          const deltaX = e.clientX - dragStartX;
          dragStartX = e.clientX;
          shelfPanVelocity += deltaX * 0.0006;
        }
      });

      // 5. Raycasting for Book Click
      const raycaster = new THREE.Raycaster();
      const pointerVec = new THREE.Vector2();

      function getClickedBook(e) {
        pointerVec.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointerVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointerVec, camera);

        const meshes = books.map(b => b.mesh);
        const intersects = raycaster.intersectObjects(meshes, false);
        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          return books.find(b => b.mesh === hitMesh);
        }
        return null;
      }

      canvas.addEventListener('click', (e) => {
        const hit = getClickedBook(e);
        if (hit) {
          openArchivalModal(hit.index);
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        const hit = getClickedBook(e);
        if (hit) {
          canvas.style.cursor = 'pointer';
        } else {
          canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
        }
      });

      // 6. UI & Modal Logic
      let currentActiveIndex = 0;
      let currentTab = 'photo'; // 'photo' | 'script'

      const modalBackdrop = document.getElementById('modal-backdrop');
      const drawerOverlay = document.getElementById('drawer-overlay');
      const indexDrawer = document.getElementById('index-drawer');
      const drawerList = document.getElementById('drawer-list');

      // Populate Drawer List
      archiveData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'drawer-item';
        div.innerHTML = `
          <div class="item-id">№ ${item.id}</div>
          <div class="item-details">
            <div class="item-name">${item.title}</div>
            <div class="item-loc">${item.location}</div>
          </div>
          <div class="item-arrow">→</div>
        `;
        div.addEventListener('click', () => {
          closeDrawer();
          openArchivalModal(index);
        });
        div.addEventListener('mouseenter', () => {
          if (books[index]) {
            books[index].targetY = 0.9;
          }
        });
        drawerList.appendChild(div);
      });

      // Open / Close Drawer
      document.getElementById('open-drawer-btn').addEventListener('click', () => {
        indexDrawer.classList.add('open');
        drawerOverlay.classList.add('open');
      });
      function closeDrawer() {
        indexDrawer.classList.remove('open');
        drawerOverlay.classList.remove('open');
      }
      document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
      drawerOverlay.addEventListener('click', closeDrawer);

      // Category Tag clicks
      document.querySelectorAll('.cat-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          const loc = tag.getAttribute('data-loc');
          const matched = archiveData.findIndex(item => item.location && item.location.includes(loc));
          if (matched !== -1) {
            openArchivalModal(matched);
          } else {
            openArchivalModal(0);
          }
        });
      });

      // Modal functions
      function openArchivalModal(index) {
        currentActiveIndex = index;
        const item = archiveData[index] || { id: String(index + 1).padStart(2, '0') };

        document.getElementById('modal-specimen-id').textContent = `ARCHIVE № ${item.id} // 澳門街頭招牌文獻`;
        document.getElementById('modal-title').textContent = item.title || `招牌檔案 № ${item.id}`;
        document.getElementById('modal-location').textContent = item.location || '澳門街頭實地採集';
        document.getElementById('modal-style').textContent = item.style || '嶺南街頭字體 · 實地採集';
        document.getElementById('modal-id-text').textContent = `№ ${item.id} / 20`;
        document.getElementById('modal-note').textContent = item.note || '本件為澳門字民街頭字體檔案庫編號登錄之代表性招牌，記錄早期嶺南招牌字之書寫格調與工藝特徵。';

        currentTab = 'photo';
        updateModalTabs();
        renderModalImage();

        modalBackdrop.classList.add('active');
      }

      function closeModal() {
        modalBackdrop.classList.remove('active');
      }

      function renderModalImage() {
        const item = archiveData[currentActiveIndex];
        const container = document.getElementById('image-display-frame');
        container.innerHTML = '';

        const primaryUrl = (currentTab === 'photo') ? item.photoUrl : item.scriptUrl;
        const backupUrl = (currentTab === 'photo') ? item.remoteUrl : null;

        const img = document.createElement('img');
        img.alt = item.title || '招牌文獻影像';

        img.onload = () => {
          container.innerHTML = '';
          container.appendChild(img);
        };

        function showFallback() {
          container.innerHTML = `
            <div class="image-fallback">
              <div class="fallback-stamp">影像待匯入</div>
              <p style="font-size: 11px; color: rgba(255,255,255,0.4);">【 檔案編號 № ${item.id} · ${currentTab === 'photo' ? '實拍圖檔' : '字稿摹本'} 】</p>
              <p style="font-size: 10px; color: rgba(255,255,255,0.25); font-family: monospace;">ASSET PATH: ${primaryUrl || '待設定'}</p>
            </div>
          `;
        }

        img.onerror = () => {
          if (backupUrl && img.src !== backupUrl) {
            img.src = backupUrl;
          } else {
            showFallback();
          }
        };

        if (primaryUrl) {
          img.src = primaryUrl;
        } else if (backupUrl) {
          img.src = backupUrl;
        } else {
          showFallback();
        }
      }

      function updateModalTabs() {
        document.getElementById('tab-btn-photo').className = (currentTab === 'photo') ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-btn-script').className = (currentTab === 'script') ? 'tab-btn active' : 'tab-btn';
      }

      document.getElementById('tab-btn-photo').addEventListener('click', () => {
        currentTab = 'photo';
        updateModalTabs();
        renderModalImage();
      });

      document.getElementById('tab-btn-script').addEventListener('click', () => {
        currentTab = 'script';
        updateModalTabs();
        renderModalImage();
      });

      document.getElementById('close-card-btn').addEventListener('click', closeModal);
      document.getElementById('return-index-btn').addEventListener('click', closeModal);

      document.getElementById('prev-item-btn').addEventListener('click', () => {
        const prev = (currentActiveIndex - 1 + bookCount) % bookCount;
        openArchivalModal(prev);
      });

      document.getElementById('next-item-btn').addEventListener('click', () => {
        const next = (currentActiveIndex + 1) % bookCount;
        openArchivalModal(next);
      });

      modalBackdrop.addEventListener('click', (e) => {
        if (e.target === modalBackdrop) {
          closeModal();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
          closeDrawer();
        } else if (modalBackdrop.classList.contains('active')) {
          if (e.key === 'ArrowLeft') {
            const prev = (currentActiveIndex - 1 + bookCount) % bookCount;
            openArchivalModal(prev);
          } else if (e.key === 'ArrowRight') {
            const next = (currentActiveIndex + 1) % bookCount;
            openArchivalModal(next);
          }
        }
      });

      // Quick Nav Filters
      document.getElementById('nav-filter-all').addEventListener('click', () => openArchivalModal(0));
      document.getElementById('nav-filter-beirwei').addEventListener('click', () => openArchivalModal(0));
      document.getElementById('nav-filter-neon').addEventListener('click', () => openArchivalModal(11));
      document.getElementById('nav-filter-handcraft').addEventListener('click', () => openArchivalModal(14));

      // 7. Animation Loop with Spring Physics
      const clock = new THREE.Clock();
      const projVec = new THREE.Vector3();
      const K = 70.0;
      const C = 12.5;

      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.05);
        const elapsedTime = clock.getElapsedTime();

        // Idle wave check: if pointer inactive for > 3.5s
        let activeX = mouseX;
        let activeY = mouseY;
        const isIdle = !isPointerActive || (performance.now() - lastPointerTime > 3500);

        if (isIdle) {
          const u = (Math.sin(elapsedTime * 0.55) + 1.0) / 2.0;
          const bookA = books[Math.floor((bookCount - 1) * 0.85)];
          const bookB = books[1];

          if (bookA && bookB) {
            bookA.mesh.getWorldPosition(projVec);
            projVec.project(camera);
            const ax = (projVec.x * 0.5 + 0.5) * window.innerWidth;
            const ay = (-(projVec.y * 0.5) + 0.5) * window.innerHeight;

            bookB.mesh.getWorldPosition(projVec);
            projVec.project(camera);
            const bx = (projVec.x * 0.5 + 0.5) * window.innerWidth;
            const by = (-(projVec.y * 0.5) + 0.5) * window.innerHeight;

            activeX = ax + (bx - ax) * u;
            activeY = ay + (by - ay) * u;
          }
        }

        // Apply subtle drag pan damping
        shelfPanOffset += shelfPanVelocity;
        shelfPanVelocity *= 0.92;
        shelfPanOffset = Math.max(-0.6, Math.min(0.6, shelfPanOffset));

        // Spatial influence radius
        const s = Math.max(window.innerWidth, window.innerHeight) * 0.088;
        const s2 = s * s;

        // Substep spring integration (4 steps)
        const subSteps = 4;
        const h = delta / subSteps;

        books.forEach((b) => {
          // Intro reveal timing: cascade up from back to front
          const introStartTime = 0.2 + (bookCount - b.index) * 0.045;
          const hasEntered = elapsedTime > introStartTime;

          if (!hasEntered) {
            b.targetY = -3.2;
            b.targetZ = 0.0;
          } else {
            b.mesh.getWorldPosition(projVec);
            projVec.y += 0.1;
            projVec.project(camera);

            const sx = (projVec.x * 0.5 + 0.5) * window.innerWidth;
            const sy = (-(projVec.y * 0.5) + 0.5) * window.innerHeight;

            const dx = sx - activeX;
            const dy = (sy - activeY) * 0.55;
            const distSq = dx * dx + dy * dy;

            let influence = Math.exp(-distSq / s2);
            if (!isPointerActive && !isIdle) influence = 0;

            const baseLift = 0.78 * influence;
            b.targetY = baseLift;
            b.targetZ = baseLift * 0.35;
          }

          // Group subtle pan offset
          b.group.position.x = (1.55 + b.index * (-0.46)) + shelfPanOffset;

          // Perform spring substeps
          for (let step = 0; step < subSteps; step++) {
            // Y Spring
            const forceY = (b.targetY - b.y) * K - b.vy * C;
            b.vy += forceY * h;
            b.y += b.vy * h;

            // Z Spring
            const forceZ = (b.targetZ - b.z) * K - b.vz * C;
            b.vz += forceZ * h;
            b.z += b.vz * h;
          }

          b.mesh.position.y = b.y;
          b.mesh.position.z = b.z;

          // Dynamic tilt during movement
          b.mesh.rotation.x = -b.vy * 0.012;
        });

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);

      // 8. Resize Handler
      window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const mobile = width <= 760;

        camera.aspect = width / height;
        camera.fov = mobile ? 38 : 19.5;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
